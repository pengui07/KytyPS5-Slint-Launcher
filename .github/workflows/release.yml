# Builds the launcher for Windows and Linux and publishes a GitHub release. The launcher's own updater
# (Help > Check for updates, src/self_update.cpp) installs these archives, so their names must keep the
# "-Windows-x64.zip" and "-Linux-x86_64.tar.gz" endings, with the executable at the top of the archive.
#
# Release: push a tag like v1.2.0 (git tag v1.2.0 && git push origin v1.2.0), or run this workflow by hand
# with the tag to create.
#
# A push to main only builds (no release). That keeps the build cache warm: a tag's run can read the caches
# saved on main, but not the ones an earlier tag saved.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, like v1.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Windows-x64.zip
          - os: ubuntu-22.04
            asset: Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable && rustup default stable

      # Slint's Rust core is most of the build (about 9 minutes on Linux, 15 on Windows). The crates, Cargo's
      # target folder and the fetched sources are kept between runs. The key names the Slint tag and the
      # compiler, since a change to either rebuilds everything anyway; a CMakeLists.txt or patch change falls
      # back to the newest cache of the same Slint and compiler. The ZArchive patch is applied only once
      # (3rdparty/patches/apply_once.cmake), so a restored, already patched source configures cleanly.
      - name: Cache key
        id: cache-key
        shell: bash
        run: |
          slint=$(sed -n '/GIT_REPOSITORY https:\/\/github.com\/slint-ui\/slint.git/{n;s/.*GIT_TAG *//p}' CMakeLists.txt)
          echo "key=${{ runner.os }}-slint-$slint-rustc-$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/cargo
            build/_deps
          key: ${{ steps.cache-key.outputs.key }}-${{ hashFiles('CMakeLists.txt', '3rdparty/patches/**') }}
          restore-keys: ${{ steps.cache-key.outputs.key }}-

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libfontconfig1-dev libxkbcommon-dev

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DKYTY_LAUNCHER_VERSION=${{ env.TAG }}"

      - name: Build
        run: cmake --build build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/kyty_slint_launcher.exe -DestinationPath "dist/KytyPS5-Slint-Launcher-$env:TAG-${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          strip build/kyty_slint_launcher
          tar -czf "dist/KytyPS5-Slint-Launcher-$TAG-${{ matrix.asset }}" -C build kyty_slint_launcher

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: KytyPS5 Slint Launcher ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
